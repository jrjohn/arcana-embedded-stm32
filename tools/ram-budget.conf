# Static RAM + flash budget per firmware target (tools/ram-budget.sh, AGENTS.md R9).
# Measured with `arm-none-eabi-size` (Berkeley): RAM = data + bss (bss includes the linker's
# reserved _user_heap_stack), FLASH = text + data. Raising a number needs the reason in the
# commit message; on F051 it also needs a board run showing the tasks still start.
#
# Baseline 2026-11-24 (template main @ 69be9ce, Dockerfile.ci, Release):
#   arcana-f051  RAM  7,248 / 8,192 B (88%)   FLASH  21,064 / 65,536 B
#   arcana-f103  RAM 55,656 / 65,536 B (85%)  FLASH 193,408 / 487,424 B
# Budgets = baseline + headroom:
#   f051 RAM 7680: ~430 B of growth, and still 512 B below the 8 KB the linker would reject
#        (the linker only fails at 100%; the stack of main/ISRs lives in what is left).
#   f051 FLASH 32768: half of the 64 KB part; ~11 KB of growth.
#   f103 RAM 59392 (58 KB): ~3.6 KB of growth, 6 KB left for MSP/ISR stack and slack.
#   f103 FLASH 262144 (256 KB): ~67 KB of growth; leaves room in the 476 KB app region.
#
# elf          max_ram_bytes   max_flash_bytes
arcana-f051    7680            32768
arcana-f103    59392           262144
