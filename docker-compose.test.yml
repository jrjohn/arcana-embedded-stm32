# Local host-test run (Jenkins uses `docker build -f Dockerfile.test`, which gates the same way).
# The ctest exit code is kept: coverage is still produced, then the command exits with it.
services:
  stm32-test:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - ./coverage.info:/workspace/coverage.info
    working_dir: /workspace
    command: >
      sh -c "
        cmake -S Tests -B Tests/build -G Ninja -DCMAKE_BUILD_TYPE=Debug &&
        cmake --build Tests/build -- -j$$(nproc) || exit 1;
        (cd Tests/build && ctest --output-on-failure); rc=$$?;
        lcov --capture --directory Tests/build --output-file coverage.info
             --rc lcov_branch_coverage=0 --ignore-errors gcov,source,inconsistent &&
        lcov --remove coverage.info '*googletest*' '/usr/*' '*/Tests/*' '*/mocks/*'
             --output-file coverage.info &&
        lcov --summary coverage.info;
        exit $$rc
      "
